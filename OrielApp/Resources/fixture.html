<body>
  <div class="label">ORIEL · 半窗</div>
  <h1>留一扇窗，给眼前的事。</h1>
  <p>这是你的第一扇小窗。试着选中这段文字，或向下滚动。</p>
  <p><a href="detail.html">打开参考页面 →</a></p>
  <hr>
  <h2>需要专心时</h2>
  <p>点击小窗顶部的锁图标开启「锁定穿透」，就能继续点击和滚动小窗下面的应用。</p>
  <h2>需要看一眼时</h2>
  <p>开启「边缘唤醒」。鼠标离开后小窗隐藏，触碰原位置的边缘即可显示。</p>
  <p>显示后移入内容内部，小窗会保持可见。</p>
  <h2>随时找回来</h2>
  <p>菜单栏的「恢复小窗」可以恢复操作，并关闭自动隐藏。</p>
  <hr>
  <p>已到页面底部。</p>
